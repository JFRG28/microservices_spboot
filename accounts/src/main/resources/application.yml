server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  config:
    import:
      - optional:application_qa.yml
      - optional:application_prod.yml
  profiles:
    active: "qa"

build:
  version: "3.0"

accounts:
  message: "Welcome to PacoBank-Accounts microservice-Default profile"
  contactDetails:
    name: "JFRG28-Developer"
    email: "developer@pacobank.com"
  onCallSupport:
    - 911
    - 066
